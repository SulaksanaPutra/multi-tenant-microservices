version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
  exclusions:
    rules:
      - linters:
          - revive
        text: "should have comment"
      - linters:
          - revive
        text: "should have a package comment"
      - linters:
          - revive
        text: "stutters"
      - linters:
          - revive
        text: "unused-parameter"
      - linters:
          - revive
        text: "blank import"
      - linters:
          - revive
        text: "empty block"
      - linters:
          - revive
        text: "context.WithValue"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
