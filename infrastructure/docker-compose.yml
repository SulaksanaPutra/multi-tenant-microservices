name: microservice-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shared_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shared_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - microservice-network

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    environment:
      DOCKER_API_VERSION: "1.46"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=microservice-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservice-network

  infra-provisioner:
    build:
      context: ../infra-provisioner
      dockerfile: Dockerfile
    container_name: infra-provisioner
    restart: always
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SHARED_DB_HOST: postgres
      SHARED_DB_SECRET: ${SHARED_DB_SECRET:-default_shared_db_secret_key}
      DOCKER_NETWORK: microservice-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - microservice-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_db
      PORT: 8085
      AUTH_JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM}
    ports:
      - "${AUTH_SERVICE_PORT:-8085}:8085"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=microservice-network"
      - "traefik.http.routers.auth-service.rule=PathPrefix(`/auth`) || PathPrefix(`/.well-known`)"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.routers.auth-service.priority=10"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8085"
    networks:
      - microservice-network
    depends_on:
      postgres:
        condition: service_healthy

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: web-ui
    restart: always
    environment:
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=microservice-network"
      - "traefik.http.routers.web-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-ui.entrypoints=web"
      - "traefik.http.routers.web-ui.priority=1"
      - "traefik.http.services.web-ui.loadbalancer.server.port=3000"
    networks:
      - microservice-network

networks:
  microservice-network:
    name: microservice-network
    driver: bridge

volumes:
  postgres_data:
