name: platform-infrastructure

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shared_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shared_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - microservice-network

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    environment:
      DOCKER_API_VERSION: "1.46"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=microservice-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservice-network

  infra-provisioner:
    image: platform-infra-provisioner:latest
    build:
      context: ../infra-provisioner
      dockerfile: Dockerfile
    container_name: infra-provisioner
    restart: always
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SHARED_DB_HOST: ${SHARED_DB_HOST:-postgres}
      SHARED_DB_SECRET: ${SHARED_DB_SECRET:-default_shared_db_secret_key}
      DEDICATED_ISOLATION_MODE: ${DEDICATED_ISOLATION_MODE:-container}
      DOCKER_NETWORK: microservice-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - microservice-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web-ui:
    image: platform-web-ui:latest
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: web-ui
    restart: always
    environment:
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=microservice-network"
      - "traefik.http.routers.web-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-ui.entrypoints=web"
      - "traefik.http.routers.web-ui.priority=1"
      - "traefik.http.services.web-ui.loadbalancer.server.port=3000"
    networks:
      - microservice-network

  # ---------------------------------------------------------------------------
  # Premium tier (per-service-db profile): one dedicated postgres per service.
  # Only started with: docker compose --profile per-service-db up
  # Services point at these via <SERVICE>_DB_HOST (see scripts/up.sh).
  # ---------------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${AUTH_DB_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${USER_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  tenant-db:
    image: postgres:16-alpine
    container_name: tenant-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${TENANT_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tenant_manager_db
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d tenant_manager_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${NOTIFICATION_DB_PORT:-5437}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification_db
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  # Hosts the order data plane's shared_db in the Premium tier.
  data-plane-db:
    image: postgres:16-alpine
    container_name: data-plane-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${DATA_PLANE_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shared_db
    volumes:
      - data_plane_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d shared_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    profiles: ["per-service-db"]
    restart: always
    ports:
      - "${PAYMENT_DB_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: payment_db
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

networks:
  microservice-network:
    name: microservice-network
    driver: bridge

volumes:
  postgres_data:
  auth_db_data:
  user_db_data:
  tenant_db_data:
  notification_db_data:
  payment_db_data:
  data_plane_db_data:

