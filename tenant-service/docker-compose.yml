services:
  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenant-service
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-broker-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-broker_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@broker-rabbitmq:5672/}
      PORT: ${PORT:-8082}
    ports:
      - "${PORT:-8082}:${PORT:-8082}"
    networks:
      - broker-network

networks:
  broker-network:
    external: true
