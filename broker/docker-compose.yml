services:
  postgres:
    image: postgres:16-alpine
    container_name: broker-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: broker_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broker-network

  postgres-dedicated:
    image: postgres:16-alpine
    container_name: broker-postgres-dedicated
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: broker_dedicated_db
    ports:
      - "5433:5432"
    volumes:
      - ./init-dedicated.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_dedicated_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broker_dedicated_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broker-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: broker-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broker-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: broker-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - broker-network

  traefik:
    image: traefik:latest
    container_name: broker-traefik
    restart: always
    environment:
      DOCKER_API_VERSION: "1.46"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=broker-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "8000:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - broker-network

networks:
  broker-network:
    name: broker-network
    driver: bridge

volumes:
  postgres_data:
  postgres_dedicated_data:
