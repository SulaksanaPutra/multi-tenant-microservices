# Air hot-reload config for web-ui.
# The static files under public/ are embedded into the binary via //go:embed,
# so a rebuild is required whenever main.go or any public/* file changes.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/web-ui ."
  bin = "./tmp/web-ui"
  full_bin = ""
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = 0

[log]
  time = false

[misc]
  clean_on_exit = false
