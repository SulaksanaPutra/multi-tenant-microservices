services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    restart: always
    environment:
      SHARED_DB_HOST: ${SHARED_DB_HOST:-postgres}
      SHARED_DB_PORT: 5432
      SHARED_DB_USER: postgres
      SHARED_DB_PASSWORD: postgres
      SHARED_DB_NAME: shared_db
      SHARED_DB_SECRET: ${SHARED_DB_SECRET:-default_shared_db_secret_key}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-default_internal_service_token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TENANT_SERVICE_URL: http://tenant-service:8082
      PORT: 8084
      AUTH_JWT_PUBLIC_KEY_PEM: ${AUTH_JWT_PUBLIC_KEY_PEM}

    ports:
      - "${PORT:-8084}:${PORT:-8084}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=microservice-network"
      - "traefik.http.routers.order-service.rule=PathPrefix(`/api/orders`)"
      - "traefik.http.routers.order-service.entrypoints=web"
      - "traefik.http.services.order-service.loadbalancer.server.port=${PORT:-8084}"
    networks:
      - microservice-network

networks:
  microservice-network:
    name: microservice-network
    external: true
