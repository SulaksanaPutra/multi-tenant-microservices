        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int32
    auth_LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
