services:
  auth-service:
    image: auth-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    environment:
      PORT: ${PORT:-8085}
      DB_HOST: ${AUTH_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-auth_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      AUTH_JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-default_internal_service_token}
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=microservice-network"
      - "traefik.http.routers.auth-service.rule=PathPrefix(`/api/auth`) || PathPrefix(`/.well-known`) || PathPrefix(`/internal/auth`)"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.routers.auth-service.priority=10"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8085"
    networks:
      - microservice-network

networks:
  microservice-network:
    name: microservice-network
    external: true
