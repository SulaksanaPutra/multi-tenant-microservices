services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    environment:
      DB_HOST: broker-postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: broker_db
      RABBITMQ_URL: amqp://guest:guest@broker-rabbitmq:5672/
      PORT: "8081"
    ports:
      - "8081:8081"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=broker-network"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/v1/register`)"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.services.user-service.loadbalancer.server.port=8081"
    networks:
      - broker-network

networks:
  broker-network:
    external: true
