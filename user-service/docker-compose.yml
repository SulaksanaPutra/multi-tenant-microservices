services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    environment:
      DB_HOST: broker-postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_db
      RABBITMQ_URL: amqp://guest:guest@broker-rabbitmq:5672/
      PORT: "8081"
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    networks:
      - broker-network
networks:
  broker-network:
    external: true
